server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 159.194.208.66 ipv6=off valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Один origin для браузера - CORS не нужен.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $api_health http://api:8000;
        proxy_pass $api_health$request_uri;
    }
}
